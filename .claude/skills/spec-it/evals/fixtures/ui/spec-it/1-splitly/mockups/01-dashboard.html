<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Splitly</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    main { max-width: 40rem; margin: 0 auto; padding: var(--space-5) var(--space-4); }
    .row { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); }
    .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { background: var(--color-action); color: var(--color-on-action); border: 0; border-radius: var(--radius-sm); padding: var(--space-2) var(--space-4); }
  </style>
</head>
<body data-default-state="populated">
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main">
    <h1>Balances</h1>
    <section data-state="populated" data-fr="FR-1">
      <div class="row">
        <span class="who">You owe <span data-bind="members.m1.name"></span></span>
        <span class="num" data-bind="balances.raj_to_ana.amount" data-format="money"></span>
      </div>
      <a href="02-settle-up.html">Settle up</a>
    </section>
    <section data-state="all-settled" data-ec="EC-2" data-fr="FR-1">
      <p>Everyone is settled. Add an expense when someone pays for something shared.</p>
      <button class="btn" type="button">Add expense</button>
    </section>
  </main>
  <script src="assets/fixtures.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
