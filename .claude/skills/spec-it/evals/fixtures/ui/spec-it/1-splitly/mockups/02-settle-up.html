<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settle up | Splitly</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    main { max-width: 40rem; margin: 0 auto; padding: var(--space-5) var(--space-4); }
    .warn { background: var(--color-warning-bg); color: var(--color-warning-text); padding: var(--space-3); border-radius: var(--radius-sm); }
    label { display: block; margin-bottom: var(--space-1); }
  </style>
</head>
<body data-default-state="normal">
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main">
    <h1>Record a payback</h1>
    <form data-fr="FR-2" data-next="01-dashboard.html">
      <label for="amount">Amount to <span data-bind="members.m1.name"></span></label>
      <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" value="42.50">
      <div data-state="amount-changed" data-ec="EC-1" class="warn" role="status" aria-live="polite">
        Mei Lin changed “Internet, November” to <span data-bind="expenses.e-4182.newAmount" data-format="money"></span>. Review the new amount before you record it.
      </div>
      <p data-state="normal amount-changed"><button type="submit">Record payback</button></p>
    </form>
    <a href="01-dashboard.html">Back to balances</a>
  </main>
  <script src="assets/fixtures.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
