<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screen name | Product</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* Page-specific styles. Use theme custom properties only. */
  </style>
</head>
<body data-default-state="populated">
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <!-- App shell: product name, primary navigation as <nav> with <a> links to sibling screens -->
  </header>

  <main id="main">
    <h1>Screen title</h1>

    <!-- Default state -->
    <section data-state="populated" data-fr="FR-1">
      <!-- Values come from fixtures: -->
      <p><span data-bind="members.m1.name"></span> paid <span data-bind="expenses.e-1.amount" data-format="money"></span></p>
    </section>

    <!-- One container per state; edge-case states carry their EC -->
    <section data-state="empty" data-fr="FR-1">
      <!-- What to do next, plus the action -->
    </section>

    <section data-state="error-example" data-ec="EC-1">
      <!-- What happened and how to fix it -->
    </section>
  </main>

  <script src="assets/fixtures.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
